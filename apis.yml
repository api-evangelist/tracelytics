aid: tracelytics
name: Tracelytics
description: >-
  Tracelytics was a Boston/Providence application-tracing (APM) startup, backed by
  investors including Google Ventures, that built full-stack distributed tracing for
  web applications. AppNeta acquired Tracelytics in 2012 and the product became
  AppNeta TraceView; SolarWinds acquired TraceView in 2016, and AppNeta itself was
  acquired by Broadcom in 2021. The company no longer operates independently — the
  tracelytics.com domain no longer resolves and its TraceView Data API
  (api.tracelytics.com) is defunct — but its verified GitHub organization and
  first-party TraceView instrumentation packages remain published on RubyGems and npm.
